# =============================================================================
# Nginx Main Configuration — Prelude Portal
# =============================================================================
# This is the top-level nginx config. It controls how nginx itself runs and
# sets global defaults for all sites. You typically only need to edit this
# file once during initial setup.
#
# File location: /etc/nginx/nginx.conf
# Test after editing: sudo nginx -t
# Apply changes:      sudo systemctl reload nginx
# =============================================================================

# --- Process Settings --------------------------------------------------------
# "user" controls which Linux user nginx worker processes run as.
# www-data is the default on Ubuntu/Debian. On CentOS/RHEL, use "nginx".
user www-data;

# "auto" sets one worker process per CPU core. This is the recommended value
# for nearly all deployments — nginx handles thousands of connections per
# worker, so you rarely need to tune this.
worker_processes auto;

# Where nginx writes error messages. Severity levels from least to most
# verbose: emerg, alert, crit, error, warn, notice, info, debug.
# "notice" is a good default — set to "error" in production to reduce noise,
# or "info"/"debug" when troubleshooting.
error_log /var/log/nginx/error.log notice;

# File that stores the process ID of the main nginx process.
# Used by systemd to manage the service — do not change this.
pid /var/run/nginx.pid;

# Load any dynamically compiled nginx modules (e.g. mod-http-geoip).
# On a fresh install this directory is usually empty and can be ignored.
include /etc/nginx/modules-enabled/*.conf;

# --- Connection Handling -----------------------------------------------------
events {
    # Maximum simultaneous connections each worker process can handle.
    # 1024 is a safe default. Each proxied request uses ~2 connections
    # (one from client, one to upstream), so this supports ~512 concurrent
    # users per CPU core. Increase if you expect heavy traffic.
    worker_connections 1024;
}

# --- HTTP Server Settings ----------------------------------------------------
# Everything inside this block applies to all HTTP/HTTPS traffic.
http {

    # Maps file extensions to MIME types (e.g. .css → text/css) so browsers
    # know how to handle each file. The mime.types file ships with nginx.
    include /etc/nginx/mime.types;

    # Fallback MIME type for files nginx can't identify by extension.
    # "application/octet-stream" tells the browser to download rather than
    # try to render the file.
    default_type application/octet-stream;

    # --- Logging -------------------------------------------------------------
    # Defines the format for access logs. Each line records one request with:
    #   client IP, user, timestamp, request line, status code, bytes sent,
    #   referrer, browser, and forwarded-for header.
    # These logs are invaluable for debugging — check them with:
    #   sudo tail -f /var/log/nginx/access.log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # --- Performance ---------------------------------------------------------
    # sendfile: lets the kernel transfer files directly to the network socket
    # without copying through userspace. Much faster for serving static files.
    sendfile on;

    # tcp_nopush: batches HTTP response headers with the first chunk of data
    # into a single TCP packet, reducing the number of packets sent.
    # Only works when sendfile is on.
    tcp_nopush on;

    # tcp_nodelay: disables Nagle's algorithm, sending small packets
    # immediately instead of waiting to batch them. Important for interactive
    # applications where latency matters (like the portal UI).
    tcp_nodelay on;

    # Maximum size of the hash table used to look up MIME types.
    # Increase this if nginx warns about hash bucket sizes at startup.
    types_hash_max_size 2048;

    # How long to keep idle connections open. Clients reuse these connections
    # for subsequent requests, avoiding the overhead of a new TCP handshake.
    # 65 seconds is a sensible default.
    keepalive_timeout 65;

    # --- Compression (Gzip) --------------------------------------------------
    # Compresses responses before sending them to the client, significantly
    # reducing bandwidth usage. A typical JSON API response compresses 70-80%.
    # The client's browser decompresses automatically — this is transparent.
    gzip on;

    # Tells caching proxies that compressed and uncompressed versions are
    # different, preventing a cache from serving a compressed response to a
    # client that doesn't support gzip.
    gzip_vary on;

    # Don't bother compressing responses smaller than ~10 KB — the overhead
    # of compression outweighs the savings for tiny payloads.
    gzip_min_length 10240;

    # Compress responses from upstream (proxied) servers even when the
    # upstream set cache-control headers like "no-cache" or "private".
    # Without this, most proxied API responses would skip compression.
    gzip_proxied expired no-cache no-store private auth;

    # Which content types to compress. Only text-based formats benefit —
    # images, videos, and already-compressed files (zip, gzip) should NOT
    # be listed here as they'd just waste CPU.
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;

    # Don't compress for ancient Internet Explorer versions (6 and below)
    # which have broken gzip support. Safe to leave in — costs nothing.
    gzip_disable "MSIE [1-6]\.";

    # --- Security Headers ----------------------------------------------------
    # These headers are added to every response and instruct the browser to
    # enable built-in security protections.

    # Prevents the portal from being embedded in an <iframe> on another site.
    # Protects against "clickjacking" attacks where a malicious site overlays
    # invisible frames to trick users into clicking things.
    add_header X-Frame-Options SAMEORIGIN;

    # Stops browsers from guessing ("sniffing") the content type of a
    # response. Without this, a browser might treat a text file as HTML
    # and execute scripts embedded in it.
    add_header X-Content-Type-Options nosniff;

    # Enables the browser's built-in cross-site scripting (XSS) filter.
    # If a reflected XSS attack is detected, the browser blocks the page
    # instead of rendering it. Note: modern browsers are deprecating this
    # in favor of Content-Security-Policy, but it's still worth having
    # for older browser support.
    add_header X-XSS-Protection "1; mode=block";

    # --- TLS Hardening (active after Certbot adds SSL) -----------------------
    # These directives only take effect once you have SSL certificates
    # installed (e.g. via Certbot). They are harmless on HTTP-only setups.

    # Only allow TLS 1.2 and 1.3. Older versions (TLS 1.0, 1.1) have known
    # vulnerabilities and are rejected by modern compliance standards.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prefer strong ciphers and disable weak ones (NULL ciphers, MD5).
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Let the server choose the cipher, not the client. Prevents downgrade
    # attacks where a client requests a weaker cipher.
    ssl_prefer_server_ciphers on;

    # HSTS (HTTP Strict Transport Security): tells browsers to ALWAYS use
    # HTTPS for this domain for the next year. After the first HTTPS visit,
    # the browser will refuse to connect over plain HTTP.
    # "includeSubDomains" applies to arranger.portal.yourlab.org, etc.
    # Only uncomment this AFTER you have confirmed HTTPS is working.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Site Configuration --------------------------------------------------
    # These lines load additional config files. This is how nginx discovers
    # your portal site configuration:
    #
    #   conf.d/       — Drop-in configs (used by some packages)
    #   sites-enabled — Symlinks to configs in sites-available (recommended)
    #
    # Your portal config goes in sites-available/portal and gets symlinked
    # into sites-enabled. See portal.conf in this directory for the template.
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}