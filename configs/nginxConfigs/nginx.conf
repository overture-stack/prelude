# Main site
server {
    listen 80;
    listen [::]:80;
    server_name overturemcp.genomeinformatics;

    # Stage frontend
    location / {
        proxy_pass http://localhost:3000;
        include proxy_params;
    }

    # All four Arranger datasets via a single location block.
    # The trailing slash on proxy_pass strips the /api/arranger/ prefix,
    # so /api/arranger/correlation/graphql → localhost:5050/correlation/graphql
    location /api/arranger/ {
        proxy_pass http://localhost:5050/;
        include proxy_params;
    }
}

# Arranger — direct subdomain access
server {
    listen 80;
    listen [::]:80;
    server_name arranger.overturemcp.genomeinformatics.org;

    location / {
        proxy_pass http://localhost:5050/;
        include proxy_params;
    }
}

# Elasticsearch
server {
    listen 80;
    listen [::]:80;
    server_name es.overturemcp.genomeinformatics.org;

    # Uncomment and set your trusted IP range:
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://localhost:9200/;
        include proxy_params;
    }
}