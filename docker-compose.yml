services:
  # ================================================================================== #
  # ================================================================================== #
  #                                    Demo:                                           #
  #                             Search & Exploration                                   #
  # ================================================================================== #
  setup:
    # ================================================================================== #
    #  Runs scripts thats automate general setup and configuration.                      #
    #  Update the enviorment variables here according to your specific project           #
    #  More information can be found within the docs folder                              #
    # ================================================================================== #
    profiles: ["demo", "platform", "default"]
    image: alpine/curl:8.8.0
    container_name: setup
    volumes:
      - ./setup:/setup
      - ./setup/volumes/health:/health
    environment:
      # Global Configuration
      PROFILE: ${PROFILE:-default}
      DEBUG: false
      # PostgreSQL Configuration
      POSTGRES_CONFIGS_DIR: setup/configs/postgresConfigs
      # PostgreSQL Connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      # Elasticsearch Index Configuration
      ES_INDEX_COUNT: 1
      # First index
      ES_INDEX_0_NAME: datatable1-index
      ES_INDEX_0_TEMPLATE_FILE: setup/configs/elasticsearchConfigs/datatable1-mapping.json
      ES_INDEX_0_TEMPLATE_NAME: datatable1-index
      ES_INDEX_0_ALIAS_NAME: datatable1_centric
      # Arranger Services Configuration
      ARRANGER_COUNT: 1
      ARRANGER_0_URL: http://arranger-datatable1:5050
      # Service Connections
      ES_USER: ${ES_USER:-elastic}
      ES_PASS: ${ES_PASSWORD:-myelasticpassword}
      ES_URL: http://elasticsearch:9200
      STAGE_URL: http://stage:3000
      STAGE_PORT: ${STAGE_PORT:-3000}
    command: >
      sh -c '
        set -e
        echo "Profile is set to: $PROFILE"
        case "$PROFILE" in
          "demo")
            echo "Running demo deployment..."
            chmod +x setup/scripts/deployments/platform.sh
            setup/scripts/deployments/platform.sh
            ;;
          "platform")
            echo "Running platform deployment..."
            chmod +x setup/scripts/deployments/platform.sh
            setup/scripts/deployments/platform.sh
            ;;
          *)
            echo "Invalid profile specified."
            exit 1
            ;;
        esac
        exit 0
      '
    healthcheck:
      test: ["CMD", "test", "-f", "setup/volumes/health/setup_health"]
      interval: 5s
      timeout: 40s
      retries: 100
      start_period: 30s
    networks:
      - platform-network

  # --------------------------------------------------------------------------------------#
  # Conductor CLI - Data Upload Service                                                  #
  # --------------------------------------------------------------------------------------#
  # Pulls the published Conductor image — no local Node.js build required.              #
  # Used automatically by `make demo` to load sample data.                              #
  # For interactive use, run ./conductor from the repo root instead.                    #
  # --------------------------------------------------------------------------------------#
  conductor-cli:
    profiles: ["demo", "default"]
    image: ghcr.io/overture-stack/conductor:171d9ce
    container_name: conductor-cli
    pull_policy: if_not_present
    volumes:
      - ./data:/data
    environment:
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-myelasticpassword}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
    command: >
      sh -c '
        echo "Starting conductor CLI - data upload service"
        echo "Available files in /data: $$(ls /data/ || echo none)"
        node dist/main.js upload \
        -f /data/datatable1.csv \
        -t datatable1 \
        -i datatable1-index \
        --db-host postgres:5432 \
        --db-user "$$POSTGRES_USER" \
        --db-pass "$$POSTGRES_PASSWORD" \
        --db-name "$$POSTGRES_DB" \
        --es-host elasticsearch:9200 \
        --es-user "$$ES_USER" \
        --es-pass "$$ES_PASSWORD"
      '
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # PostgreSQL                                                                         #
  # -----------------------------------------------------------------------------------#
  # Persistant storage for data being indexed into elasticsearch.                      #
  # -----------------------------------------------------------------------------------#
  postgres:
    profiles: ["demo", "platform", "default"]
    image: postgres:15-alpine
    pull_policy: if_not_present
    container_name: postgres
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432" # Localhost only — not accessible from the network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-network

  # --------------------------------------------------------------------------------------#
  # Elasticsearch                                                                         #
  # --------------------------------------------------------------------------------------#
  # A search and analytics engine used to help query massive datatables.                  #
  # https://www.elastic.co/guide/en/elasticsearch/reference/7.17/elasticsearch-intro.html #
  # --------------------------------------------------------------------------------------#
  elasticsearch:
    profiles: ["demo", "platform", "default"]
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.27
    pull_policy: if_not_present
    container_name: elasticsearch
    platform: linux/amd64
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: workflow.elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx2048m
      ES_USER: ${ES_USER:-elastic}
      ELASTIC_PASSWORD: ${ES_PASSWORD:-myelasticpassword}
      xpack.security.enabled: "true"
    ports:
      - "127.0.0.1:9200:9200" # Localhost only — not accessible from the network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2"
        reservations:
          memory: 2G
    volumes:
      - elasticsearch-data:/usr/share/configs/elasticsearch/data
    healthcheck:
      test:
        "curl --silent --fail localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s ||
        exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Arranger-Server for our tabular data                                                #
  # ------------------------------------------------------------------------------------#
  # Search API generation with compatible search UI components                          #
  # https://docs.overture.bio/docs/core-software/Arranger/overview                      #
  # ------------------------------------------------------------------------------------#
  arranger-datatable1:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/arranger-server:4919f736
    pull_policy: if_not_present
    container_name: arranger-datatable1
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    volumes:
      - ./setup/configs/arrangerConfigs/datatable1:/app/apps/search-server/configs
    environment:
      # Elasticsearch Variables
      ES_HOST: http://elasticsearch:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASS: ${ES_PASSWORD:-myelasticpassword}
      ES_ARRANGER_SET_INDEX: datatable1_arranger_set
      # Arranger Variables (Port required)
      PORT: 5050
      DEBUG: false
      ENABLE_LOGS: false
    ports:
      - "127.0.0.1:5050:5050" # Localhost only — not accessible from the network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5050/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Stage                                                                               #
  # ------------------------------------------------------------------------------------#
  # The react-based, front end UI scaffolding for Overture                              #
  # https://docs.overture.bio/docs/core-software/Stage/overview                         #
  # ------------------------------------------------------------------------------------#
  stage:
    profiles: ["demo", "platform", "default"]
    build:
      context: .
      dockerfile: ./apps/stage/Dockerfile
    image: stageimage:1.0
    container_name: stage
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - "${STAGE_PORT:-3000}:3000"
    environment:
      # Stage Variables
      NEXTAUTH_URL: http://localhost:3000/api/auth
      NEXT_PUBLIC_LAB_NAME: ${NEXT_PUBLIC_LAB_NAME:-IBC Workshop}
      NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL:-admin@example.org}
      NEXT_PUBLIC_DEBUG: false
      NEXT_PUBLIC_SHOW_MOBILE_WARNING: true
      NEXT_PUBLIC_ENABLE_DOWNLOADS: true
      NEXT_PUBLIC_DISABLE_WELCOME_BANNER: false
      # Datatable1 Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_API: http://arranger-datatable1:5050
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_INDEX: datatable1_centric
      NEXT_PUBLIC_DATATABLE_1_EXPORT_ROW_ID_FIELD: submission_metadata.submission_id
      # Auth Variables
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SESSION_ENCRYPTION_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      # CORS
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
      # PostgreSQL (for data submission)
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-overtureDb}
      POSTGRES_USERNAME: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      # Elasticsearch (for data submission)
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: ${ES_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ES_PASSWORD:-myelasticpassword}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    volumes:
      - stage-data:/usr/src/public/static/dms_user_assets
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Nginx — Local Reverse Proxy (Extension Activity)                                  #
  # ------------------------------------------------------------------------------------#
  # Workshop extension activity only. Runs Nginx inside Docker so attendees can        #
  # access the portal at http://portal.local instead of http://localhost:3000.         #
  #                                                                                    #
  # Start with: make nginx  (requires the platform to already be running)             #
  # Requires /etc/hosts entry: 127.0.0.1 portal.local datatable1-arranger.portal.local#
  # ------------------------------------------------------------------------------------#
  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    pull_policy: if_not_present
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./setup/configs/nginxConfigs/workshop-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      stage:
        condition: service_healthy
      arranger-datatable1:
        condition: service_healthy
    networks:
      - platform-network

volumes:
  elasticsearch-data:
  stage-data:
  postgres-data:
networks:
  platform-network:
    driver: bridge
