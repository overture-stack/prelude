# ====================================================================================== #
# Shared config blocks (YAML anchors).                                                    #
# Define once here (before first use), reference with `*name`.                            #
# ====================================================================================== #
x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

services:
  # ================================================================================== #
  # ================================================================================== #
  #                                    Demo:                                           #
  #                             Search & Exploration                                   #
  # ================================================================================== #
  setup:
    # ================================================================================== #
    #  Runs scripts thats automate general setup and configuration.                      #
    #  Update the enviorment variables here according to your specific project           #
    #  More information can be found within the docs folder                              #
    # ================================================================================== #
    profiles: ["demo", "platform", "default"]
    image: alpine/curl:8.8.0
    pull_policy: if_not_present
    container_name: setup
    volumes:
      - ./setup:/setup
      - ./setup/volumes/health:/health
      - ./configs:/configs
      # ARGO clinical docs (donor.ndjson) are bulk-loaded from here in setup_indices step;
      # conductor's flat-CSV loader can't ingest the nested _bulk file.
      - ./data:/data
    environment:
      # Global Configuration
      PROFILE: ${PROFILE:-default}
      DEBUG: false
      # PostgreSQL Configuration
      POSTGRES_CONFIGS_DIR: configs/postgres
      # PostgreSQL Connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      # OpenSearch Index Configuration
      # Indices are discovered from the mapping files in this directory following the
      # "<name>-mapping.json" -> index "<name>-index", alias "<name>_centric" convention.
      # Add an index by dropping a mapping file here — no per-index env vars to maintain.
      ES_INDEX_CONFIG_DIR: /configs/opensearch
      # Arranger Services Configuration
      # The healthcheck auto-discovers catalogues by scanning the mounted config
      # directory, so adding/removing a catalogue needs no changes here, just
      # add/remove its folder under configs/arranger.
      ARRANGER_URL: http://arranger:5050
      ARRANGER_CONFIG_DIR: /configs/arranger
      # Service Connections
      ES_USER: ${ES_USER:-elastic}
      ES_PASS: ${ES_PASSWORD:-myelasticpassword}
      ES_URL: http://opensearch:9200
      STAGE_URL: http://stage:3000
      STAGE_PORT: ${STAGE_PORT:-3000}
    command: >
      sh -c '
        set -e
        echo "Profile is set to: $PROFILE"
        case "$PROFILE" in
          "demo"|"platform")
            echo "Running $PROFILE deployment..."
            chmod +x setup/scripts/deployments/platform.sh
            setup/scripts/deployments/platform.sh
            ;;
          *)
            echo "Invalid profile specified."
            exit 1
            ;;
        esac
        exit 0
      '
    healthcheck:
      test: ["CMD", "test", "-f", "setup/volumes/health/setup_health"]
      interval: 5s
      timeout: 40s
      retries: 100
      start_period: 30s
    networks:
      - platform-network

  # --------------------------------------------------------------------------------------#
  # Conductor CLI - Data Upload Service                                                  #
  # --------------------------------------------------------------------------------------#
  # Pulls the published Conductor image — no local Node.js build required.              #
  # Used automatically by `make demo` to load sample data.                              #
  # For interactive use, run ./conductor from the repo root instead.                    #
  # --------------------------------------------------------------------------------------#
  conductor-cli:
    profiles: ["demo", "default"]
    # Built from local source (apps/conductor) so it uses the @opensearch-project/opensearch
    # client. The published image uses @elastic/elasticsearch, whose 7.14+ product check
    # rejects OpenSearch ("server is not Elasticsearch") and blocks all indexing.
    build:
      context: .
      dockerfile: ./apps/conductor/Dockerfile
    image: conductor-opensearch:local
    container_name: conductor-cli
    volumes:
      - ./data:/data
    # Tables to load. Add a table by listing it here AND providing
    # /data/tables/<name>.csv (file -> /data/tables/<name>.csv, type -> <name>,
    # index -> <name>-index).
    environment:
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-myelasticpassword}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
      DATA_TABLES: "correlation expression mutation protein fixture"
    command: >
      sh -c '
        set -e
        echo "Starting conductor CLI - data upload service"
        echo "Available files in /data/tables: $$(ls /data/tables/ || echo none)"
        for t in $$DATA_TABLES; do
          echo "Uploading $$t ..."
          node dist/main.js upload \
            -f /data/tables/$$t.csv \
            -t $$t \
            -i $$t-index \
            --db-host postgres:5432 \
            --db-user "$$POSTGRES_USER" \
            --db-pass "$$POSTGRES_PASSWORD" \
            --db-name "$$POSTGRES_DB" \
            --es-host opensearch:9200 \
            --es-user "$$ES_USER" \
            --es-pass "$$ES_PASSWORD"
        done
      '
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # PostgreSQL                                                                         #
  # -----------------------------------------------------------------------------------#
  # Persistant storage for data being indexed into opensearch.                         #
  # -----------------------------------------------------------------------------------#
  postgres:
    profiles: ["demo", "platform", "default"]
    image: postgres:15-alpine
    pull_policy: if_not_present
    container_name: postgres
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432" # Localhost only — not accessible from the network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-overtureDb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-network

  # --------------------------------------------------------------------------------------#
  # OpenSearch                                                                            #
  # --------------------------------------------------------------------------------------#
  # A search and analytics engine used to help query massive datatables.                  #
  # Apache-2.0 fork of Elasticsearch 7.10; https://opensearch.org/docs/latest/            #
  # --------------------------------------------------------------------------------------#
  opensearch:
    profiles: ["demo", "platform", "default"]
    # Pin/override the tag via OPENSEARCH_TAG in .env. 2.x serves the ES7-style index
    # templates and queries this stack uses; the mapping files need no changes.
    image: opensearchproject/opensearch:${OPENSEARCH_TAG:-2.17.1}
    pull_policy: if_not_present
    container_name: opensearch
    platform: linux/amd64
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: workflow.opensearch
      # Security plugin OFF for this localhost-bound demo: keeps the API on plain HTTP
      # (no self-signed TLS) so the existing http:// clients and setup scripts work
      # unchanged, and no admin password is required. Do NOT disable security on any
      # network-exposed deployment.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # NOTE: do NOT set `compatibility.override_main_response_version` here. It hides
      # `version.distribution` on `GET /`, so Arranger auto-detects the Elasticsearch
      # client (not OpenSearch) and fails to init with "Could not create a mapping".
      # Arranger keys its client selection on the real `distribution: opensearch` value.
      # Heap size. Tune for smaller machines (e.g. workshop laptops) via .env.
      # Keep -Xmx at or below the deploy memory limit below. ES_JAVA_OPTS is kept as
      # the override key so existing .env files keep working.
      OPENSEARCH_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx2048m}
    ports:
      - "127.0.0.1:9200:9200" # Localhost only — not accessible from the network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-3G}
          cpus: "2"
        reservations:
          memory: ${ES_MEM_RESERVATION:-2G}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -f 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Arranger-Server for our tabular data                                                #
  # ------------------------------------------------------------------------------------#
  # Search API generation with compatible search UI components                          #
  # https://docs.overture.bio/docs/core-software/Arranger/overview                      #
  # ------------------------------------------------------------------------------------#
  arranger:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/arranger-search-server:b5c6051b
    pull_policy: if_not_present
    container_name: arranger
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    volumes:
      - ./configs/arranger:/app/configs
    environment:
      # OpenSearch connection (ES_* var names kept: Arranger reads these keys)
      ES_HOST: http://opensearch:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASS: ${ES_PASSWORD:-myelasticpassword}
      ES_ARRANGER_SET_INDEX: arranger_set
      # Arranger Variables (Port required)
      PORT: 5050
      DEBUG: false
      # Logs on so `docker logs arranger` is useful when the setup healthcheck points there.
      ENABLE_LOGS: true
    ports:
      - "127.0.0.1:5050:5050" # Localhost only — not accessible from the network
    healthcheck:
      # /ping only proves the server process is up — it returns 200 even when an
      # individual catalogue's GraphQL endpoint failed to mount (the arranger-sets
      # startup race, see docs/developer issue ticket). So probe every catalogue's
      # GraphQL endpoint instead: a catalogue that lost the race 500s here and marks
      # the whole container unhealthy, which surfaces in `docker ps` and blocks
      # dependents that wait on `condition: service_healthy`.
      # The catalogue list mirrors the directories in configs/arranger/.
      test:
        [
          "CMD-SHELL",
          'for c in correlation expression fixture mutation protein donor; do curl -sf -X POST -H ''Content-Type: application/json'' -d ''{"query":"{ __typename }"}'' "http://localhost:5050/$$c/graphql" | grep -q __typename || exit 1; done',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Arranger MCP Server                                                                 #
  # ------------------------------------------------------------------------------------#
  # Exposes Arranger catalogues as MCP tools/resources for LLM clients (LM Studio,      #
  # Claude Desktop, etc.). Streamable HTTP transport — once running, connect at         #
  # http://localhost:${MCP_PORT:-3100}/mcp  (client transport type: "http").            #
  #                                                                                      #
  # Runs the published edge image directly: it ships the built app and launches         #
  # `tsx apps/mcp-server/src/index.ts` on port 3100. Bump the tag below to upgrade.     #
  # ------------------------------------------------------------------------------------#
  arranger-mcp:
    profiles: ["demo", "default"]
    image: ghcr.io/overture-stack/arranger-mcp-server:b4a414ce
    pull_policy: if_not_present
    container_name: arranger-mcp
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      arranger:
        condition: service_healthy
    environment:
      # Required — the server exits on startup if either is missing or invalid.
      ARRANGER_BASE_URL: http://arranger:5050
      ARRANGER_CATALOGUES: ${ARRANGER_MCP_CATALOGUES:-correlation,mutation,expression,protein,donor}
      # Optional — listed with their image defaults for discoverability.
      MCP_HOST: 0.0.0.0
      MCP_PATH: /mcp
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    ports:
      # Container always listens on 3100; MCP_PORT changes only the host-side port.
      - "127.0.0.1:${MCP_PORT:-3100}:3100"
    healthcheck:
      # No dedicated health route (only /mcp, which needs a session), so a plain TCP
      # connect to the listening port is enough to prove the process is up. node is
      # always present in the image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3100,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - platform-network

  # ------------------------------------------------------------------------------------#
  # Stage                                                                               #
  # ------------------------------------------------------------------------------------#
  # The react-based, front end UI scaffolding for Overture                              #
  # https://docs.overture.bio/docs/core-software/Stage/overview                         #
  # ------------------------------------------------------------------------------------#
  stage:
    profiles: ["demo", "platform", "default"]
    build:
      context: .
      dockerfile: ./apps/stage/Dockerfile
    image: stageimage:1.0
    container_name: stage
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGE_PORT:-3000}:3000" # Localhost only — nginx is the public entry point
    environment:
      # Stage Variables
      # PORTAL_URL: set this in .env for production (e.g. http://overturemcp.genomeinformatics)
      NEXTAUTH_URL: ${PORTAL_URL:-http://localhost:3000}/api/auth
      NEXT_PUBLIC_LAB_NAME: ${NEXT_PUBLIC_LAB_NAME:-My Data Portal}
      NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL:-admin@example.org}
      NEXT_PUBLIC_DEBUG: false
      NEXT_PUBLIC_SHOW_MOBILE_WARNING: true
      NEXT_PUBLIC_ENABLE_DOWNLOADS: true
      NEXT_PUBLIC_DISABLE_WELCOME_BANNER: false
      # Arranger base URL — browser-facing, used by the Developer Tools dropdown links.
      # Routes through nginx: /api/arranger/* → localhost:5050/*
      NEXT_PUBLIC_ARRANGER_API: ${PORTAL_URL:-http://localhost:3000}/api/arranger
      # Arranger API — internal Docker DNS, used server-side by Stage's proxy only.
      # The browser never calls these URLs directly; it calls Stage at /api/dataset_N_arranger/*
      # and Stage forwards server-side to these targets.
      #
      # Data tables: Stage exposes a FIXED set of 5 slots (DATATABLE_1..5). The slot
      # count is hardcoded in the Stage source (next.config.js, pages/<name>Table/,
      # pages/api/[...proxy].ts, global/utils/constants.ts), so these env vars are the
      # config layer for those slots — they are NOT auto-discovered from configs/.
      # Per-table convention for a table named <name>:
      #   _API   -> http://arranger:5050/<name>     _INDEX -> <name>_centric
      #   _DOCUMENT_TYPE -> records                 _EXPORT_ROW_ID_FIELD -> submission_metadata.submission_id
      # Adding or changing a table touches more than this file — see the
      # "Adding a data table" checklist in docs/developer/02-Local-Setup.md.
      # Correlation Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_API: http://arranger:5050/correlation
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_INDEX: correlation_centric
      NEXT_PUBLIC_DATATABLE_1_EXPORT_ROW_ID_FIELD: submission_metadata.submission_id
      NEXT_PUBLIC_ENABLE_DATATABLE_1_QUICKSEARCH: true
      # Mutation Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_2_API: http://arranger:5050/mutation
      NEXT_PUBLIC_ARRANGER_DATATABLE_2_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_2_INDEX: mutation_centric
      NEXT_PUBLIC_DATATABLE_2_EXPORT_ROW_ID_FIELD: submission_metadata.submission_id
      NEXT_PUBLIC_ENABLE_DATATABLE_2_QUICKSEARCH: true
      # Expression Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_3_API: http://arranger:5050/expression
      NEXT_PUBLIC_ARRANGER_DATATABLE_3_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_3_INDEX: expression_centric
      NEXT_PUBLIC_DATATABLE_3_EXPORT_ROW_ID_FIELD: submission_metadata.submission_id
      NEXT_PUBLIC_ENABLE_DATATABLE_3_QUICKSEARCH: true
      # Protein Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_4_API: http://arranger:5050/protein
      NEXT_PUBLIC_ARRANGER_DATATABLE_4_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_4_INDEX: protein_centric
      NEXT_PUBLIC_DATATABLE_4_EXPORT_ROW_ID_FIELD: submission_metadata.submission_id
      NEXT_PUBLIC_ENABLE_DATATABLE_4_QUICKSEARCH: true
      # ARGO Donor (clinical) Arranger Variables
      NEXT_PUBLIC_ARRANGER_DATATABLE_5_API: http://arranger:5050/donor
      NEXT_PUBLIC_ARRANGER_DATATABLE_5_DOCUMENT_TYPE: records
      NEXT_PUBLIC_ARRANGER_DATATABLE_5_INDEX: donor_centric
      NEXT_PUBLIC_DATATABLE_5_EXPORT_ROW_ID_FIELD: submitter_donor_id
      NEXT_PUBLIC_ENABLE_DATATABLE_5_QUICKSEARCH: true
      # Auth Variables
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SESSION_ENCRYPTION_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      # CORS — honours CORS_ALLOWED_ORIGIN if set in .env, otherwise falls back to PORTAL_URL.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-${PORTAL_URL:-}}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    volumes:
      - stage-data:/usr/src/public/static/dms_user_assets
    networks:
      - platform-network

volumes:
  opensearch-data:
  stage-data:
  postgres-data:
networks:
  platform-network:
    driver: bridge
