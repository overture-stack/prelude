name: overture-demo

services:
  # ================================================================================== #
  #                                    Setup                                           #
  #                        Orchestrates platform deployment                            #
  # ================================================================================== #
  setup:
    profiles: ["demo", "platform", "default"]
    image: alpine/curl:8.8.0
    container_name: setup
    volumes:
      - ./apps/setup:/setup
      - ./apps/setup/volumes/health:/health
      - ./configs:/configs
      - ./data:/data
    environment:
      PROFILE: ${PROFILE:-default}
      DEBUG: false
      # Elasticsearch
      ES_USER: elastic
      ES_PASS: myelasticpassword
      ES_URL: http://elasticsearch:9200
      ES_INDEX_COUNT: 1
      ES_INDEX_0_NAME: file-index
      ES_INDEX_0_TEMPLATE_FILE: configs/elasticsearchConfigs/file-mapping.json
      ES_INDEX_0_TEMPLATE_NAME: file-index
      ES_INDEX_0_ALIAS_NAME: file_centric
      # Arranger
      ARRANGER_COUNT: 1
      ARRANGER_0_URL: http://arranger-file:5050
      # Stage
      STAGE_URL: http://stage:3000
      STAGE_PORT: ${STAGE_PORT:-3000}
      # Song / Score / MinIO / Maestro
      SONG_URL: http://song:8080
      SONG_STUDY_ID: demo
      SONG_STUDY_NAME: Demo
      SONG_STUDY_DESCRIPTION: Overture demo genomic data portal
      SONG_STUDY_ORGANIZATION: Overture
      SONG_SCHEMA_DIR: configs/songConfigs
      SONG_PAYLOAD_DIR: /data/payloads
      SONG_FILES_DIR: data/files
      SCORE_URL: http://score:8087
      OBJECT_STORAGE_URL: http://minio:9000
      MAESTRO_URL: http://maestro:11235
      SCORE_ACCESS_TOKEN: "68fb42b4-f1ed-4e8c-beab-3724b99fe528"
      # MinIO credentials for bucket init via curl --aws-sigv4
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_DEFAULT_REGION: us-east-1
    command: >
      sh -c '
        set -e
        echo "Profile is set to: $PROFILE"
        case "$PROFILE" in
          "demo"|"platform")
            chmod +x setup/scripts/deployments/platform.sh
            setup/scripts/deployments/platform.sh
            ;;
          *)
            echo "Invalid profile specified."
            exit 1
            ;;
        esac
        exit 0
      '
    healthcheck:
      test: ["CMD", "test", "-f", "setup/volumes/health/setup_health"]
      interval: 5s
      timeout: 40s
      retries: 100
      start_period: 30s
    networks:
      - platform-network

  # ================================================================================== #
  #                              Infrastructure                                        #
  # ================================================================================== #

  # -----------------------------------------------------------------------------------#
  # Song Database — dedicated Postgres for Song; Flyway manages the schema             #
  # -----------------------------------------------------------------------------------#
  song-db:
    profiles: ["demo", "platform", "default"]
    image: postgres:11.1
    container_name: song-db
    platform: linux/amd64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: songDb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d songDb"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - song-database-data:/var/lib/postgresql/data
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # Elasticsearch                                                                      #
  # -----------------------------------------------------------------------------------#
  elasticsearch:
    profiles: ["demo", "platform", "default"]
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.27
    pull_policy: if_not_present
    container_name: elasticsearch
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      cluster.name: workflow.elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx2048m
      ES_USER: elastic
      ELASTIC_PASSWORD: myelasticpassword
      xpack.security.enabled: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2"
        reservations:
          memory: 2G
    volumes:
      - elasticsearch-data:/usr/share/configs/elasticsearch/data
    healthcheck:
      test:
        "curl --silent --fail localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s ||
        exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - platform-network

  # ================================================================================== #
  #                         File Management                                            #
  #               Kafka  ·  MinIO  ·  Song  ·  Score                                  #
  # ================================================================================== #

  # -----------------------------------------------------------------------------------#
  # Kafka — KRaft mode (no Zookeeper)                                                  #
  # kafkaSetup.sh is mounted into the container and runs before the broker starts      #
  # -----------------------------------------------------------------------------------#
  kafka:
    profiles: ["demo", "platform", "default"]
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ./apps/setup/scripts/services/kafka/kafkaSetup.sh:/scripts/kafkaSetup.sh
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
    command: >
      sh -c '
        echo "Setting up Kafka topics..."
        chmod +x /scripts/kafkaSetup.sh
        /scripts/kafkaSetup.sh &
        /etc/confluent/docker/run
      '
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # MinIO — object storage                                                             #
  # Must be 2018 version: Score validates ETag == MD5 per uploaded part;              #
  # newer MinIO versions changed this behaviour and break Score uploads.               #
  # -----------------------------------------------------------------------------------#
  minio:
    profiles: ["demo", "platform", "default"]
    image: minio/minio:RELEASE.2018-05-11T00-29-24Z
    container_name: minio
    platform: linux/amd64
    ports:
      - "8085:9000"
    environment:
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
    command: server /data
    volumes:
      - minio-data:/data
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # Song — metadata registry                                                           #
  # Flyway manages songDb schema. `secure` profile omitted → no OAuth2.               #
  # -----------------------------------------------------------------------------------#
  song:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/song-server:5131f6f8
    container_name: song
    platform: linux/amd64
    depends_on:
      song-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev, noSecurityDev, kafka
      SPRING_FLYWAY_ENABLED: "true"
      ID_USELOCAL: "true"
      SCHEMAS_ENFORCELATEST: "true"
      SCORE_URL: http://score:8087
      SCORE_ACCESSTOKEN: "68fb42b4-f1ed-4e8c-beab-3724b99fe528"
      SPRING_DATASOURCE_URL: jdbc:postgresql://song-db:5432/songDb?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      SPRING_KAFKA_TEMPLATE_DEFAULTTOPIC: song-analysis
      SWAGGER_ALTERNATEURL: /swagger-api
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # Score — file transfer service                                                      #
  # `secure` / `jwt` profiles omitted; bypass token accepted in non-secure mode.      #
  # -----------------------------------------------------------------------------------#
  score:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/score-server:5.12.0
    container_name: score
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      # Spring Variables
      SPRING_PROFILES_ACTIVE: noSecurityDev, s3
      SERVER_PORT: 8087
      # Song Variable
      METADATA_URL: http://song:8080
      METADATA_USE_LEGACY_MODE: "true"
      # Score Variables
      SERVER_SSL_ENABLED: "false"
      # Object Storage Variables
      S3_ENDPOINT: http://minio:9000
      S3_PRE_SIGNED_URL_OVERRIDE_HOST: localhost:8085
      S3_ACCESSKEY: admin
      S3_SECRETKEY: admin123
      S3_SIGV4ENABLED: true
      S3_SECURED: false
      OBJECT_SENTINEL: heliograph
      BUCKET_NAME_OBJECT: object
      BUCKET_NAME_STATE: state
      UPLOAD_PARTSIZE: 1073741824
      UPLOAD_CONNECTION_TIMEOUT: 1200000
    networks:
      - platform-network

  # ================================================================================== #
  #                         Search & Indexing                                          #
  # ================================================================================== #

  # -----------------------------------------------------------------------------------#
  # Maestro — indexes Song analyses into Elasticsearch via Kafka events                #
  # -----------------------------------------------------------------------------------#
  maestro:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/maestro:cc8aa3d
    container_name: maestro
    platform: linux/amd64
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - "11235:11235"
    environment:
      # Logging
      MAESTRO_LOGGING_LEVEL: info
      # Elasticsearch Settings
      MAESTRO_ELASTICSEARCH_NODES: "http://elasticsearch:9200"
      MAESTRO_ELASTICSEARCH_VERSION: 7
      MAESTRO_ELASTICSEARCH_CLIENT_BASICAUTH_ENABLED: true
      MAESTRO_ELASTICSEARCH_CLIENT_BASICAUTH_USER: elastic
      MAESTRO_ELASTICSEARCH_CLIENT_BASICAUTH_PASSWORD: myelasticpassword
      MAESTRO_ELASTICSEARCH_CLIENT_RETRY_MAX_ATTEMPTS: 3
      MAESTRO_ELASTICSEARCH_CLIENT_RETRY_WAIT_DURATION_MILLIS: 500
      MAESTRO_ELASTICSEARCH_CLIENT_DOCS_PER_BULK_REQ_MAX: 5000
      MAESTRO_ELASTICSEARCH_CLIENT_CONNECTION_TIMEOUT: 5000
      # Kafka
      MAESTRO_KAFKA_BROKERS: kafka:9092
      MAESTRO_KAFKA_GROUP_ID: maestro
      MAESTRO_KAFKA_INDEX_REQUEST_TOPIC: maestro_index_requests
      MAESTRO_KAFKA_INDEX_REQUEST_DLQ: maestro_index_requests_dlq
      # Repository Configuration - Song
      MAESTRO_REPOSITORIES_0_BASE_URL: http://song:8080
      MAESTRO_REPOSITORIES_0_CODE: song.overture
      MAESTRO_REPOSITORIES_0_NAME: Overture Song
      MAESTRO_REPOSITORIES_0_PAGINATION_SIZE: 50
      MAESTRO_REPOSITORIES_0_INDEX_NAME: file-index
      MAESTRO_REPOSITORIES_0_TYPE: SONG
      MAESTRO_REPOSITORIES_0_SONG_INDEXABLE_STUDY_STATES: PUBLISHED
      MAESTRO_REPOSITORIES_0_SONG_INDEXING_MODE: file
      MAESTRO_REPOSITORIES_0_SONG_ORGANIZATION: OICR
      MAESTRO_REPOSITORIES_0_SONG_COUNTRY: CA
      MAESTRO_REPOSITORIES_0_KAFKA_DOCUMENT_UPDATE_TOPIC: song-analysis
      MAESTRO_REPOSITORIES_0_KAFKA_DOCUMENT_UPDATE_DLQ: song-analysis-dlq
    networks:
      - platform-network

  # -----------------------------------------------------------------------------------#
  # Arranger — GraphQL search API over file_centric index                              #
  # -----------------------------------------------------------------------------------#
  arranger-file:
    profiles: ["demo", "platform", "default"]
    image: ghcr.io/overture-stack/arranger-server:1f685ab4
    pull_policy: if_not_present
    container_name: arranger-file
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ./configs/arrangerConfigs:/app/configs
    environment:
      ES_HOST: http://elasticsearch:9200
      ES_USER: elastic
      ES_PASS: myelasticpassword
      ES_ARRANGER_SET_INDEX: file_arranger_set
      PORT: 5050
      DEBUG: false
      ENABLE_LOGS: false
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5050/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - platform-network

  # ================================================================================== #
  #                               Portal UI                                            #
  # ================================================================================== #

  # -----------------------------------------------------------------------------------#
  # Stage                                                                              #
  # -----------------------------------------------------------------------------------#
  stage:
    profiles: ["demo", "platform", "default"]
    build:
      context: .
      dockerfile: ./apps/stage/Dockerfile
    image: stageimage:1.0
    container_name: stage
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - "${STAGE_PORT:-3000}:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000/api/auth
      NEXT_PUBLIC_LAB_NAME: Overture Demo Portal
      NEXT_PUBLIC_ADMIN_EMAIL: admin@example.com
      NEXT_PUBLIC_DEBUG: false
      NEXT_PUBLIC_SHOW_MOBILE_WARNING: true
      NEXT_PUBLIC_ENABLE_DOWNLOADS: true
      NEXT_PUBLIC_DISABLE_WELCOME_BANNER: false
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_API: http://arranger-file:5050
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_DOCUMENT_TYPE: file
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_INDEX: file_centric
      NEXT_PUBLIC_ARRANGER_DATATABLE_1_MANIFEST_COLUMNS: repositories.code,analysis.analysisId,object_id,file_type,file.name,file.size,file.md5sum,file.index_file.object_id,analysis.samples.donor.submitterDonorId,project_id,study_id
      NEXT_PUBLIC_DATATABLE_1_EXPORT_ROW_ID_FIELD: object_id
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      SESSION_ENCRYPTION_SECRET: ${NEXTAUTH_SECRET:-your-secure-secret-here}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
      # PostgreSQL (for data submission)
      DB_HOST: song-db
      DB_PORT: 5432
      POSTGRES_DATABASE: songDb
      POSTGRES_USERNAME: admin
      POSTGRES_PASSWORD: admin123
      # Elasticsearch (for data submission)
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: myelasticpassword
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    volumes:
      - stage-data:/usr/src/public/static/dms_user_assets
    networks:
      - platform-network

  # ================================================================================== #
  #                              Data Submission Clients                             #
  # ================================================================================== #

  # ----------------------------------------------------------------------------------#
  # Song Client — submits analysis metadata and publishes analyses                   #
  # ----------------------------------------------------------------------------------#
  song-client:
    profiles: ["submit"]
    image: ghcr.io/overture-stack/song-client:5131f6f8
    platform: linux/amd64
    environment:
      CLIENT_ACCESS_TOKEN: "68fb42b4-f1ed-4e8c-beab-3724b99fe528"
      CLIENT_STUDY_ID: demo
      CLIENT_SERVER_URL: http://song:8080
    volumes:
      - ./data:/output
    networks:
      - platform-network

  # ----------------------------------------------------------------------------------#
  # Score Client — uploads data files to object storage                              #
  # ----------------------------------------------------------------------------------#
  score-client:
    profiles: ["submit"]
    image: ghcr.io/overture-stack/score-client:ee758b91
    platform: linux/amd64
    environment:
      ACCESSTOKEN: "68fb42b4-f1ed-4e8c-beab-3724b99fe528"
      STORAGE_URL: http://score:8087
      METADATA_URL: http://song:8080
    volumes:
      - data:/output
    networks:
      - platform-network

volumes:
  minio-data:
  song-database-data:
  elasticsearch-data:
  kafka-data:
  stage-data:
networks:
  platform-network:
    driver: bridge
