# =============================================================================
# Prelude Portal — Nginx Site Configuration Template
# =============================================================================
# This file defines which domain names map to which backend services.
# Each "server" block handles requests for one subdomain.
#
# Before deploying:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. portal.yourlab.org)
#   2. Uncomment additional server blocks if you use those services
#   3. Verify ports match your docker-compose.yml configuration
#
# Setup:
#   sudo cp portal.conf /etc/nginx/sites-available/portal
#   sudo ln -s /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/
#   sudo nginx -t              # Always test before reloading!
#   sudo systemctl reload nginx
#
# After setup, add SSL with:
#   sudo certbot --nginx -d YOUR_DOMAIN -d datatable1-arranger.YOUR_DOMAIN
# =============================================================================


# --- Stage Frontend ----------------------------------------------------------
# This is the main portal UI. All browser traffic to your domain lands here.
# Stage runs on port 3000 inside Docker.
server {
    # Listen on port 80 for both IPv4 and IPv6 connections.
    # Certbot will automatically add port 443 (HTTPS) lines when you run it.
    listen 80;
    listen [::]:80;

    # The domain name this block responds to. Requests to any other domain
    # on this server will NOT match this block.
    server_name YOUR_DOMAIN;

    # Forward all requests to the Stage container.
    # "location /" matches every URL path.
    location / {
        # proxy_pass tells nginx where to send the request.
        # "localhost:3000" means the Stage container's exposed port on this
        # machine. If you changed the port in docker-compose.yml, update it here.
        proxy_pass http://localhost:3000;

        # Pull in the shared proxy settings (timeouts, headers, etc.)
        # from the proxy_params file. See proxy_params for details on
        # each setting.
        include proxy_params;
    }
}


# --- Arranger API (datatable1) -----------------------------------------------
# Arranger provides the search/filter API that the portal's data table uses.
# Each data table in your portal has its own Arranger instance on a separate
# port. This block routes the datatable1 subdomain to that instance.
server {
    listen 80;
    listen [::]:80;
    server_name datatable1-arranger.YOUR_DOMAIN;

    location / {
        # Note the trailing slash on the URL — this is important!
        # Without it, nginx forwards the path as-is (e.g. /graphql becomes
        # /graphql). With the trailing slash, nginx strips the location
        # prefix before forwarding. For root locations (/) it doesn't
        # matter, but it's a good habit for consistency.
        proxy_pass http://localhost:5050/;
        include proxy_params;
    }
}


# --- Arranger API (datatable2) -----------------------------------------------
# Uncomment this block if your portal has a second data table.
# Make sure port 5051 matches the second Arranger service in docker-compose.yml
# and that you've created a DNS CNAME for datatable2-arranger.YOUR_DOMAIN.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name datatable2-arranger.YOUR_DOMAIN;
#
#     location / {
#         proxy_pass http://localhost:5051/;
#         include proxy_params;
#     }
# }


# --- Elasticsearch (optional) ------------------------------------------------
# Only expose Elasticsearch if external tools (e.g. Kibana on another machine)
# need direct access. Arranger already talks to Elasticsearch over Docker's
# internal network, so the portal does NOT need this block to function.
#
# WARNING: Elasticsearch has no built-in authentication in the default setup.
# If you uncomment this, strongly consider:
#   - Restricting access by IP (shown below with allow/deny)
#   - Changing the default Elasticsearch password in docker-compose.yml
#   - Using SSL (run certbot with this domain included)
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name es.YOUR_DOMAIN;
#
#     # Restrict to your trusted network — replace with your IP range.
#     # allow 192.168.1.0/24;
#     # deny all;
#
#     location / {
#         proxy_pass http://localhost:9200/;
#         include proxy_params;
#     }
# }
