# =============================================================================
# Workshop Nginx Config — containerized Version
# =============================================================================
# This config is used in the optional extension activity only.
# It runs Nginx inside Docker as part of the Compose stack.
#
# KEY DIFFERENCE FROM PRODUCTION:
#   Production (host-installed Nginx, doc 09 reference section):
#     proxy_pass http://localhost:3000;
#
#   This file (Nginx inside Docker):
#     proxy_pass http://stage:3000;
#
# When Nginx runs as a container on the same Docker network, it reaches other
# services by their Compose service names ("stage", "arranger-datatable1"),
# not "localhost". Localhost inside the Nginx container refers to Nginx itself,
# not the host machine. The concepts — server_name, proxy_pass, location —
# are identical; only the upstream addresses differ.
#
# Local domain: http://portal.local
# Prerequisites: add the following line to your /etc/hosts file:
#   127.0.0.1 portal.local datatable1-arranger.portal.local
# =============================================================================


# --- Stage Frontend ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Matches the /etc/hosts entry you added on your local machine.
    server_name portal.local;

    location / {
        # "stage" is the Docker Compose service name — Nginx resolves it
        # to the container's IP over the shared Docker network.
        # Compare with the production config: proxy_pass http://localhost:3000;
        proxy_pass http://stage:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# --- Arranger API (datatable1) -----------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name datatable1-arranger.portal.local;

    location / {
        # Trailing slash strips the location prefix before forwarding.
        # For root location blocks this doesn't change behaviour, but it
        # is good practice and important for non-root paths.
        proxy_pass http://arranger-datatable1:5050/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
